[package]
name = "fluxion-dsp"
readme = "../../README.md"
description = "Differentiable, cross-vendor, framework-agnostic audio DSP with a functional graph API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# Published as `fluxion-dsp`, like every crate of the family: `fluxion` and
# `fluxion-core` belong to other projects on crates.io. The library keeps its
# name, so code still writes `use fluxion::…`.
name = "fluxion"

[lints]
workspace = true

[features]
# Whole-graph differentiation via Burn's autograd (plan tasks E12 + C1). Pulls in Burn; the default
# facade stays pure-Rust and offline.
autodiff = ["dep:fluxion-autodiff", "fluxion-autodiff/burn"]
# The real-time engine: re-exports RtGraph / RtEngine / SosStream / SmoothedValue and the freeze /
# to_rt_graph lowering + FrozenSos plan. Pure-Rust (no extra system deps unless you also enable
# fluxion-rt's own `cpal` feature); off by default so the base facade surface stays minimal.
realtime = ["dep:fluxion-rt"]

[dependencies]
fluxion-core = { package = "fluxion-dsp-core", path = "../fluxion-core", version = "0.3.0" }
fluxion-ops = { package = "fluxion-dsp-ops", path = "../fluxion-ops", version = "0.3.0" }
fluxion-backend = { package = "fluxion-dsp-backend", path = "../fluxion-backend", version = "0.3.0" }
fluxion-autodiff = { package = "fluxion-dsp-autodiff", path = "../fluxion-autodiff", version = "0.3.0", optional = true }
fluxion-rt = { package = "fluxion-dsp-rt", path = "../fluxion-rt", version = "0.3.0", optional = true }
