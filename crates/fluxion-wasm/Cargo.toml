[package]
name = "fluxion-wasm"
description = "Fluxion: WebAssembly bindings (wasm-bindgen) for the CPU + WebGPU path."
# A wasm-bindgen cdylib for the browser, not a crates.io library — never published.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
# `cdylib` is the wasm artifact; `rlib` keeps `cargo test -p fluxion-wasm` working natively, so the
# parts that are not wasm-specific are tested on the host like everything else.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# The facade, which is wasm-clean: it does not pull fluxion-io (Symphonia/hound), and CubeCL is
# behind the `cuda` feature. WebGPU via wgpu arrives with the GPU path (roadmap W8).
fluxion = { path = "../fluxion-facade", version = "0.0.0" }
# Panics become readable console messages instead of "unreachable executed".
console_error_panic_hook = "0.1"

[dev-dependencies]
# The parity fixture is JSON so the Node side can read it without a Rust toolchain. Already in the
# offline backbone via fluxion-core, so this adds nothing new to the tree.
serde_json = "1"
