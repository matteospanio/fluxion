[package]
name = "fluxion-wasm"
description = "Fluxion: WebAssembly bindings (wasm-bindgen) for the CPU + WebGPU path."
# A wasm-bindgen cdylib for the browser, not a crates.io library — never published.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
# `cdylib` is the wasm artifact; `rlib` keeps `cargo test -p fluxion-wasm` working natively, so the
# parts that are not wasm-specific are tested on the host like everything else.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# The canonical companion of wasm-bindgen, and the only way to accept a *list* of typed arrays.
# Taking one flat buffer instead would have given the browser a different shape of side-input API
# from every other interface, which is the drift docs/interfaces.md exists to prevent.
js-sys = "0.3"
# The facade, which is wasm-clean: it does not pull fluxion-io (Symphonia/hound), and CubeCL is
# behind the `cuda` feature. WebGPU via wgpu arrives with the GPU path (roadmap W8).
# `realtime` brings in the allocation-free block executor and the lock-free ring the
# worklet runs on. It does not pull cpal — that is a separate feature of fluxion-rt — so
# the tree stays wasm-clean.
fluxion = { path = "../fluxion-facade", version = "0.2.0", features = ["realtime"] }
# Panics become readable console messages instead of "unreachable executed".
# The lock-free ring and the smoothed parameter, used directly by the player.
fluxion-rt = { path = "../fluxion-rt", version = "0.2.0" }
console_error_panic_hook = "0.1"

[dev-dependencies]
# The parity fixture is JSON so the Node side can read it without a Rust toolchain. Already in the
# offline backbone via fluxion-core, so this adds nothing new to the tree.
serde_json = "1"
