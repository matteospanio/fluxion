[package]
name = "fluxion-dsp-rt"
description = "Fluxion: real-time engine — lock-free SPSC ring buffer and allocation-free executor."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# Published as `fluxion-dsp-rt`, like every crate of the family: `fluxion` and
# `fluxion-core` belong to other projects on crates.io. The library keeps its
# name, so code still writes `use fluxion_rt::…`.
name = "fluxion_rt"

[lints]
workspace = true

[features]
# Cross-platform realtime audio I/O via CPAL. Requires the platform audio dev libraries (ALSA on
# Linux); the default build needs none, so it stays pure-Rust and offline.
cpal = ["dep:cpal"]

[dependencies]
fluxion-core = { package = "fluxion-dsp-core", path = "../fluxion-core", version = "0.3.0" }
fluxion-ops = { package = "fluxion-dsp-ops", path = "../fluxion-ops", version = "0.3.0" }
cpal = { version = "0.15", optional = true }
