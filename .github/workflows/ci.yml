name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  lint:
    name: fmt & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `-D warnings` fails on any rustdoc issue (broken/ambiguous doc links); combined with the
      # workspace `missing_docs = "warn"` lint (denied by the clippy job), the public API stays
      # documented. `--lib` documents every library target (skipping the `fluxion` CLI binary, which
      # would otherwise collide with the facade lib's doc output).
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --lib --locked

  # docs/ops.md and the generated interface bindings are copies of the op registry. Regenerate them
  # and fail if anything moved: that is what turns "an op ships on every interface" (docs/
  # interfaces.md) into a check rather than a promise. A hand edit to a generated file fails here
  # too, which is the point.
  contract:
    name: interface contract (generated docs & bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p fluxion-cli --locked
      - run: python3 scripts/gen_interfaces.py
      - name: generated files are up to date
        run: git diff --exit-code -- docs/ crates/fluxion-py/python/ crates/fluxion-wasm/js/

  autodiff:
    name: autodiff (Burn CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The Burn integration is behind an optional feature, so the default `test`/`lint` jobs skip it.
      # Exercise its analytic-VJP custom ops (sos, sos_trainable, sos_design, fir_trainable) here.
      - run: cargo clippy -p fluxion-autodiff --features burn --all-targets --locked -- -D warnings
      - run: cargo test -p fluxion-autodiff --features burn --locked
      # The facade's whole-graph autodiff surface (diff_process) is behind its own feature.
      - run: cargo test -p fluxion --features autodiff --locked

  realtime:
    name: realtime CLI (CPAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # play/record are behind the `realtime` feature (CPAL), so the default test/lint jobs skip them.
      - run: cargo clippy -p fluxion-cli --features realtime --all-targets --locked -- -D warnings
      - run: cargo test -p fluxion-cli --features realtime --locked

  parquet:
    name: batch IO + checkpoint import (Arrow/Parquet/safetensors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Columnar dataset IO pulls arrow/parquet, off the default build — exercise it explicitly.
      - run: cargo clippy -p fluxion-io --features parquet,checkpoint --all-targets --locked -- -D warnings
      - run: cargo test -p fluxion-io --features parquet,checkpoint --locked

  deny:
    name: cargo-deny (licenses & advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  # ROADMAP I3: "a fresh virtualenv on all three systems installs the wheel and runs the
  # quickstart". Native builds on the three runners, on every PR — not `wheels.yml`, which is a
  # release matrix whose cross-compiled aarch64 wheel cannot be executed here and so would prove
  # nothing about the quickstart.
  python:
    name: python bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          # Pinned: PyO3 0.22 does not support 3.14, which is the runners' default. One
          # cp310-abi3 wheel covers CPython 3.10+ regardless of the interpreter that builds it.
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fluxion-py
          key: ${{ matrix.os }}
      # torch / jax are not installed (heavy); those adapter tests skip — the API, the analytic
      # gradcheck, and scipy filter-design parity are the guards here.
      - run: pip install --upgrade pip maturin numpy pytest scipy array_api_strict array-api-compat
      - run: maturin build --release -m crates/fluxion-py/Cargo.toml --out dist

      # A *fresh* venv, in a scratch directory: the quickstart has to work against nothing but the
      # wheel and numpy. It writes in.wav / out.wav into the working directory, hence the cd.
      - name: fresh venv + quickstart
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/fxvenv"
          "$RUNNER_TEMP/fxvenv/bin/pip" install --quiet dist/*.whl
          mkdir -p "$RUNNER_TEMP/quickstart" && cd "$RUNNER_TEMP/quickstart"
          "$RUNNER_TEMP/fxvenv/bin/python" "$GITHUB_WORKSPACE/crates/fluxion-py/tests/quickstart.py"
      - name: fresh venv + quickstart
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\fxvenv"
          & "$env:RUNNER_TEMP\fxvenv\Scripts\pip" install --quiet (Get-ChildItem dist\*.whl)
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\quickstart" | Out-Null
          Set-Location "$env:RUNNER_TEMP\quickstart"
          & "$env:RUNNER_TEMP\fxvenv\Scripts\python" "$env:GITHUB_WORKSPACE\crates\fluxion-py\tests\quickstart.py"

      - name: install the wheel and run the suite
        shell: bash
        run: |
          pip install dist/*.whl
          pytest crates/fluxion-py/tests/ -v

  benches:
    name: benches (compile-check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Compile the Criterion harnesses so they can't rot; --no-run means we never spend CI time
      # actually measuring (benches are a local tool, this is just a build tripwire).
      - run: cargo bench --no-run -p fluxion-ops -p fluxion-backend --locked

  # ROADMAP I5: "CI compiles and runs the C example on the three systems". Passing the archive as a
  # plain file path rather than `-l:libfluxion_ffi.a` is what makes that possible — `-l:` is a
  # GNU-ld extension that Apple's ld64 rejects and MSVC has no concept of.
  ffi:
    name: C ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: cargo test -p fluxion-ffi --locked
      - run: cargo build -p fluxion-ffi --locked

      # Prove the ABI links and works from actual C, on every system a host might use.
      - name: compile & run the C examples (Linux)
        if: runner.os == 'Linux'
        run: |
          for example in smoke quickstart; do
            cc crates/fluxion-ffi/examples/$example.c -I crates/fluxion-ffi/include \
               target/debug/libfluxion_ffi.a -lpthread -lm -ldl -o $example
            ./$example
          done
      - name: compile & run the C examples (macOS)
        if: runner.os == 'macOS'
        # No libdl on macOS — its dlopen lives in libSystem.
        run: |
          for example in smoke quickstart; do
            cc crates/fluxion-ffi/examples/$example.c -I crates/fluxion-ffi/include \
               target/debug/libfluxion_ffi.a -lpthread -lm -o $example
            ./$example
          done
      - name: compile & run the C examples (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        # If this system-library list ever rots, the authoritative source is:
        #   cargo rustc -p fluxion-ffi --crate-type staticlib -- --print native-static-libs
        run: |
          for %%e in (smoke quickstart) do (
            cl /nologo crates\fluxion-ffi\examples\%%e.c /I crates\fluxion-ffi\include ^
               target\debug\fluxion_ffi.lib ws2_32.lib userenv.lib ntdll.lib bcrypt.lib advapi32.lib ^
               /Fe:%%e.exe || exit /b 1
            %%e.exe || exit /b 1
          )

      # The header is committed so consumers build with no Rust toolchain in the loop. That only
      # works if it actually matches the source, which nothing checked before.
      - name: header is in sync with the source
        if: runner.os == 'Linux'
        run: |
          cargo install --locked cbindgen@0.29.4
          cbindgen --config crates/fluxion-ffi/cbindgen.toml --crate fluxion-ffi \
                   --output "$RUNNER_TEMP/fluxion.h"
          diff -u crates/fluxion-ffi/include/fluxion.h "$RUNNER_TEMP/fluxion.h"

  cuda:
    name: cuda check (API drift, no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cubecl/cudarc load CUDA at *runtime*, so the CUDA code paths compile with no nvcc or GPU
      # present. Check only (never run) — this just catches API drift in the otherwise-untested
      # `cuda`-feature code.
      - run: cargo check -p fluxion-backend -p fluxion-autodiff --features cuda --locked
